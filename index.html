  <script src="data/chapters.js?v=20260912a"></script>
  <script>
    const grid = document.getElementById("chapters-grid");
    CHAPTERS.forEach((chapter) => {
      const card = document.createElement("a");
      card.href = chapter.href;
      card.className = "chapter-card active";
      const number = document.createElement("div");
      number.className = "chapter-number";
      number.textContent = "第 " + chapter.id + " 章";
      const title = document.createElement("div");
      title.className = "chapter-name";
      title.textContent = chapter.name;
      const description = document.createElement("div");
      description.className = "chapter-desc";
      description.textContent = chapter.desc;
      const footer = document.createElement("div");
      footer.className = "chapter-footer";
      footer.textContent = chapter.topics.length + " 个实验主题 →";
      card.append(number, title, description, footer);
      grid.appendChild(card);
    });
  </script>
